include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - "**/*.g.dart"
    - web/**
    # Add Jaspr's generated options files here if analysis flags them.

plugins:
  jaspr_lints:
    version: ^0.7.2
    diagnostics:
      prefer_html_components: true
      sort_children_last: true # Jaspr's equivalent of sort_child_properties_last
      styles_ordering: true

linter:
  rules:
    # --- flutter_lints equivalents that are not tied to Flutter types ---
    - avoid_print
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # --- Async safety ---
    - unawaited_futures
    - discarded_futures
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks

    # --- Type safety ---
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_annotating_with_dynamic
    - only_throw_errors
    - always_specify_types          # no bare `var` or `final x =`; generics must be explicit too
    - type_annotate_public_apis

    # --- Style and consistency (Flutter repo conventions) ---
    - prefer_single_quotes
    - directives_ordering
    - always_use_package_imports
    - sort_unnamed_constructors_first
    - prefer_final_fields
    - prefer_final_locals
    - avoid_redundant_argument_values
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_named_constants

formatter:
  page_width: 90
  trailing_commas: preserve